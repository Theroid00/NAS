name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested-cpu.txt
      - run: python -m pip install -r requirements-tested-cpu.txt -r requirements-service.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_comparison.py --smoke --budget 7 --population 3 --seeds 42 43
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t nas-inference .
      - name: Create offline integration fixture
        run: |
          mkdir -p "$RUNNER_TEMP/nas-fixture"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/nas-fixture:/fixtures" nas-inference python scripts/container_fixture.py --out /fixtures
      - name: Serve read-only artifact and verify predictions
        run: |
          docker run -d --name nas-smoke -p 8000:8000 -v "$RUNNER_TEMP/nas-fixture/artifact:/models/selected:ro" nas-inference
          python scripts/container_smoke.py --fixture "$RUNNER_TEMP/nas-fixture"
          docker restart nas-smoke
          python scripts/container_smoke.py --fixture "$RUNNER_TEMP/nas-fixture"
      - name: Reject missing and corrupt artifacts
        run: |
          if docker run --rm -e NAS_ARTIFACT=/models/missing nas-inference; then exit 1; fi
          cp -r "$RUNNER_TEMP/nas-fixture/artifact" "$RUNNER_TEMP/nas-fixture/corrupt"
          truncate -s 1 "$RUNNER_TEMP/nas-fixture/corrupt/model.pt"
          if docker run --rm -v "$RUNNER_TEMP/nas-fixture/corrupt:/models/selected:ro" nas-inference; then exit 1; fi
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs nas-smoke || true
          docker rm -f nas-smoke || true
